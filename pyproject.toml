[project]
name = "gpt-practice"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "torch>=2.13.0",
    # Not a torch dependency -- torch treats numpy as optional -- but
    # `.numpy()`, dataloaders and tokenizers all need it. Must be declared
    # explicitly or `uv sync` will prune it.
    "numpy>=2.5.2",
]

# PyTorch ROCm 7.1 wheels (matches system ROCm 7.1.1).
# NOT explicit: torch pulls in `triton-rocm`, which exists ONLY on this index,
# never on PyPI. With explicit=true uv refuses to look here for it and
# resolution fails with "no version of triton-rocm".
[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.1"

[tool.uv.sources]
torch = { index = "pytorch-rocm" }
triton-rocm = { index = "pytorch-rocm" }
